name: opengym

services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    build:
      context: ./api
      target: ${API_TARGET:-default}
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=${PORT:-3000}
      - DATA_DIR=/data
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      - ./data:/data
      - ./coach-auth:/coach-auth

  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}
      - BACKEND=${BACKEND:-api}
      - PORT=${PORT:-3000}
      - RESOLVER=${RESOLVER:-127.0.0.11}
      - CF_CONNECTING_IP=${CF_CONNECTING_IP:-}
      - BASE_PATH=${BASE_PATH:-}
      - MEDIA_UPLOAD_MAX=${MEDIA_UPLOAD_MAX:-48m}

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      web:
        condition: service_started
